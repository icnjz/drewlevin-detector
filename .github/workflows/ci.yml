name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:secrets
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker build --tag detector-test .
      - run: |
          docker run --detach --init --name detector-test --publish 127.0.0.1:4173:4173 detector-test
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/api/stats > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs detector-test
          exit 1
      - if: always()
        run: docker rm --force detector-test
