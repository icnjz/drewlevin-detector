services:
  detector:
    build: .
    image: drewlevin-detector:local
    init: true
    restart: unless-stopped
    ports:
      - "${DETECTOR_PORT:-4173}:4173"
    environment:
      RIOT_API_KEY: ${RIOT_API_KEY:-}
      HOST: 0.0.0.0
      PORT: 4173
    volumes:
      - detector-state:/app/.wrangler/state

volumes:
  detector-state:
